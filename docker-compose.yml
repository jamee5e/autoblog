services:
  postgres:
    image: postgres:17
    container_name: autoblog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: autoblog
    ports:
      - "5432:5432"
    volumes:
      - autoblog_postgres_data:/var/lib/postgresql/data

volumes:
  autoblog_postgres_data:
